naftiko: 1.0.0-alpha2
info:
  label: Adobe Lightroom API (Firefly Services) — Edit Image
  description: 'Adobe Lightroom API (Firefly Services) — Edit Image. 1 operations. Lead operation: Adobe Lightroom Apply Custom
    Edit Settings to an Image. Self-contained Naftiko capability covering one Lightroom business surface.'
  tags:
  - Lightroom
  - Edit Image
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LIGHTROOM_API_KEY: LIGHTROOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: firefly-services-edit-image
    baseUri: https://image.adobe.io
    description: Adobe Lightroom API (Firefly Services) — Edit Image business capability. Self-contained, no shared references.
    resources:
    - name: lrService-edit
      path: /lrService/edit
      operations:
      - name: editimage
        method: POST
        description: Adobe Lightroom Apply Custom Edit Settings to an Image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LIGHTROOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: firefly-services-edit-image-rest
    port: 8080
    description: REST adapter for Adobe Lightroom API (Firefly Services) — Edit Image. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/lrservice/edit
      name: lrservice-edit
      description: REST surface for lrService-edit.
      operations:
      - method: POST
        name: editimage
        description: Adobe Lightroom Apply Custom Edit Settings to an Image
        call: firefly-services-edit-image.editimage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: firefly-services-edit-image-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Lightroom API (Firefly Services) — Edit Image. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-lightroom-apply-custom-edit
      description: Adobe Lightroom Apply Custom Edit Settings to an Image
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: firefly-services-edit-image.editimage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
