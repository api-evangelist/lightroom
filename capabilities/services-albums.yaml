naftiko: 1.0.0-alpha2
info:
  label: Adobe Lightroom Lightroom Services API — Albums
  description: 'Adobe Lightroom Lightroom Services API — Albums. 6 operations. Lead operation: Adobe Lightroom List Albums
    in a Catalog. Self-contained Naftiko capability covering one Lightroom business surface.'
  tags:
  - Lightroom
  - Albums
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LIGHTROOM_API_KEY: LIGHTROOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: services-albums
    baseUri: https://lr.adobe.io/v2
    description: Adobe Lightroom Lightroom Services API — Albums business capability. Self-contained, no shared references.
    resources:
    - name: catalogs-catalog_id-albums
      path: /catalogs/{catalog_id}/albums
      operations:
      - name: listalbums
        method: GET
        description: Adobe Lightroom List Albums in a Catalog
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: catalogs-catalog_id-albums-album_id
      path: /catalogs/{catalog_id}/albums/{album_id}
      operations:
      - name: getalbum
        method: GET
        description: Adobe Lightroom Get a Specific Album
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createorupdatealbum
        method: PUT
        description: Adobe Lightroom Create or Update an Album
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletealbum
        method: DELETE
        description: Adobe Lightroom Delete an Album
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: catalogs-catalog_id-albums-album_id-assets
      path: /catalogs/{catalog_id}/albums/{album_id}/assets
      operations:
      - name: listalbumassets
        method: GET
        description: Adobe Lightroom List Assets in an Album
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addassetstoalbum
        method: PUT
        description: Adobe Lightroom Add Assets to an Album
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LIGHTROOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: services-albums-rest
    port: 8080
    description: REST adapter for Adobe Lightroom Lightroom Services API — Albums. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/catalogs/{catalog-id}/albums
      name: catalogs-catalog-id-albums
      description: REST surface for catalogs-catalog_id-albums.
      operations:
      - method: GET
        name: listalbums
        description: Adobe Lightroom List Albums in a Catalog
        call: services-albums.listalbums
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalogs/{catalog-id}/albums/{album-id}
      name: catalogs-catalog-id-albums-album-id
      description: REST surface for catalogs-catalog_id-albums-album_id.
      operations:
      - method: GET
        name: getalbum
        description: Adobe Lightroom Get a Specific Album
        call: services-albums.getalbum
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: createorupdatealbum
        description: Adobe Lightroom Create or Update an Album
        call: services-albums.createorupdatealbum
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletealbum
        description: Adobe Lightroom Delete an Album
        call: services-albums.deletealbum
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalogs/{catalog-id}/albums/{album-id}/assets
      name: catalogs-catalog-id-albums-album-id-assets
      description: REST surface for catalogs-catalog_id-albums-album_id-assets.
      operations:
      - method: GET
        name: listalbumassets
        description: Adobe Lightroom List Assets in an Album
        call: services-albums.listalbumassets
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: addassetstoalbum
        description: Adobe Lightroom Add Assets to an Album
        call: services-albums.addassetstoalbum
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: services-albums-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Lightroom Lightroom Services API — Albums. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-lightroom-list-albums-catalog
      description: Adobe Lightroom List Albums in a Catalog
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: services-albums.listalbums
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-get-specific-album
      description: Adobe Lightroom Get a Specific Album
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: services-albums.getalbum
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-create-update-album
      description: Adobe Lightroom Create or Update an Album
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: services-albums.createorupdatealbum
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-delete-album
      description: Adobe Lightroom Delete an Album
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: services-albums.deletealbum
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-list-assets-album
      description: Adobe Lightroom List Assets in an Album
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: services-albums.listalbumassets
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-add-assets-album
      description: Adobe Lightroom Add Assets to an Album
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: services-albums.addassetstoalbum
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
