naftiko: 1.0.0-alpha2
info:
  label: Adobe Lightroom API (Firefly Services) — Auto Straighten
  description: 'Adobe Lightroom API (Firefly Services) — Auto Straighten. 1 operations. Lead operation: Adobe Lightroom Automatically
    Straighten an Image. Self-contained Naftiko capability covering one Lightroom business surface.'
  tags:
  - Lightroom
  - Auto Straighten
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LIGHTROOM_API_KEY: LIGHTROOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: firefly-services-auto-straighten
    baseUri: https://image.adobe.io
    description: Adobe Lightroom API (Firefly Services) — Auto Straighten business capability. Self-contained, no shared references.
    resources:
    - name: lrService-autoStraighten
      path: /lrService/autoStraighten
      operations:
      - name: autostraighten
        method: POST
        description: Adobe Lightroom Automatically Straighten an Image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LIGHTROOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: firefly-services-auto-straighten-rest
    port: 8080
    description: REST adapter for Adobe Lightroom API (Firefly Services) — Auto Straighten. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/lrservice/autostraighten
      name: lrservice-autostraighten
      description: REST surface for lrService-autoStraighten.
      operations:
      - method: POST
        name: autostraighten
        description: Adobe Lightroom Automatically Straighten an Image
        call: firefly-services-auto-straighten.autostraighten
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: firefly-services-auto-straighten-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Lightroom API (Firefly Services) — Auto Straighten. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: adobe-lightroom-automatically-straighten-image
      description: Adobe Lightroom Automatically Straighten an Image
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: firefly-services-auto-straighten.autostraighten
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
