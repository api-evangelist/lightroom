naftiko: 1.0.0-alpha2
info:
  label: Adobe Lightroom Lightroom Services API — Assets
  description: 'Adobe Lightroom Lightroom Services API — Assets. 6 operations. Lead operation: Adobe Lightroom List Assets
    in a Catalog. Self-contained Naftiko capability covering one Lightroom business surface.'
  tags:
  - Lightroom
  - Assets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LIGHTROOM_API_KEY: LIGHTROOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: services-assets
    baseUri: https://lr.adobe.io/v2
    description: Adobe Lightroom Lightroom Services API — Assets business capability. Self-contained, no shared references.
    resources:
    - name: catalogs-catalog_id-assets
      path: /catalogs/{catalog_id}/assets
      operations:
      - name: listcatalogassets
        method: GET
        description: Adobe Lightroom List Assets in a Catalog
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: catalogs-catalog_id-assets-asset_id
      path: /catalogs/{catalog_id}/assets/{asset_id}
      operations:
      - name: getasset
        method: GET
        description: Adobe Lightroom Get a Specific Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createrevisionforasset
        method: PUT
        description: Adobe Lightroom Create or Update an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: catalogs-catalog_id-assets-asset_id-master
      path: /catalogs/{catalog_id}/assets/{asset_id}/master
      operations:
      - name: uploadmasterasset
        method: PUT
        description: Adobe Lightroom Upload the Master (original) File for an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
          required: true
        - name: Content-Length
          in: header
          type: integer
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: catalogs-catalog_id-assets-asset_id-xmp-develop
      path: /catalogs/{catalog_id}/assets/{asset_id}/xmp/develop
      operations:
      - name: getassetdevelopxmp
        method: GET
        description: Adobe Lightroom Get the Develop Settings Xmp for an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: putassetdevelopxmp
        method: PUT
        description: Adobe Lightroom Upload Develop Settings Xmp for an Asset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.LIGHTROOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: services-assets-rest
    port: 8080
    description: REST adapter for Adobe Lightroom Lightroom Services API — Assets. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/catalogs/{catalog-id}/assets
      name: catalogs-catalog-id-assets
      description: REST surface for catalogs-catalog_id-assets.
      operations:
      - method: GET
        name: listcatalogassets
        description: Adobe Lightroom List Assets in a Catalog
        call: services-assets.listcatalogassets
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalogs/{catalog-id}/assets/{asset-id}
      name: catalogs-catalog-id-assets-asset-id
      description: REST surface for catalogs-catalog_id-assets-asset_id.
      operations:
      - method: GET
        name: getasset
        description: Adobe Lightroom Get a Specific Asset
        call: services-assets.getasset
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: createrevisionforasset
        description: Adobe Lightroom Create or Update an Asset
        call: services-assets.createrevisionforasset
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalogs/{catalog-id}/assets/{asset-id}/master
      name: catalogs-catalog-id-assets-asset-id-master
      description: REST surface for catalogs-catalog_id-assets-asset_id-master.
      operations:
      - method: PUT
        name: uploadmasterasset
        description: Adobe Lightroom Upload the Master (original) File for an Asset
        call: services-assets.uploadmasterasset
        with:
          Content-Type: rest.Content-Type
          Content-Length: rest.Content-Length
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalogs/{catalog-id}/assets/{asset-id}/xmp/develop
      name: catalogs-catalog-id-assets-asset-id-xmp-develop
      description: REST surface for catalogs-catalog_id-assets-asset_id-xmp-develop.
      operations:
      - method: GET
        name: getassetdevelopxmp
        description: Adobe Lightroom Get the Develop Settings Xmp for an Asset
        call: services-assets.getassetdevelopxmp
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putassetdevelopxmp
        description: Adobe Lightroom Upload Develop Settings Xmp for an Asset
        call: services-assets.putassetdevelopxmp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: services-assets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Lightroom Lightroom Services API — Assets. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-lightroom-list-assets-catalog
      description: Adobe Lightroom List Assets in a Catalog
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: services-assets.listcatalogassets
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-get-specific-asset
      description: Adobe Lightroom Get a Specific Asset
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: services-assets.getasset
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-create-update-asset
      description: Adobe Lightroom Create or Update an Asset
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: services-assets.createrevisionforasset
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-upload-master-original
      description: Adobe Lightroom Upload the Master (original) File for an Asset
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: services-assets.uploadmasterasset
      with:
        Content-Type: tools.Content-Type
        Content-Length: tools.Content-Length
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-get-develop-settings
      description: Adobe Lightroom Get the Develop Settings Xmp for an Asset
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: services-assets.getassetdevelopxmp
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-lightroom-upload-develop-settings
      description: Adobe Lightroom Upload Develop Settings Xmp for an Asset
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: services-assets.putassetdevelopxmp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
