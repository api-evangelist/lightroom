naftiko: 1.0.0-alpha2
info:
  label: Adobe Lightroom Lightroom Catalog API — Health
  description: 'Adobe Lightroom Lightroom Catalog API — Health. 1 operations. Lead operation: Adobe Lightroom Check Api Health.
    Self-contained Naftiko capability covering one Lightroom business surface.'
  tags:
  - Lightroom
  - Health
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LIGHTROOM_API_KEY: LIGHTROOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: catalog-health
    baseUri: https://lr.adobe.io/v2
    description: Adobe Lightroom Lightroom Catalog API — Health business capability. Self-contained, no shared references.
    resources:
    - name: health
      path: /health
      operations:
      - name: gethealthcheck
        method: GET
        description: Adobe Lightroom Check Api Health
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LIGHTROOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: catalog-health-rest
    port: 8080
    description: REST adapter for Adobe Lightroom Lightroom Catalog API — Health. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/health
      name: health
      description: REST surface for health.
      operations:
      - method: GET
        name: gethealthcheck
        description: Adobe Lightroom Check Api Health
        call: catalog-health.gethealthcheck
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: catalog-health-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Lightroom Lightroom Catalog API — Health. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: adobe-lightroom-check-api-health
      description: Adobe Lightroom Check Api Health
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: catalog-health.gethealthcheck
      outputParameters:
      - type: object
        mapping: $.
