naftiko: 1.0.0-alpha2
info:
  label: Adobe Lightroom Lightroom Services API — Renditions
  description: 'Adobe Lightroom Lightroom Services API — Renditions. 1 operations. Lead operation: Adobe Lightroom Get an
    Asset Rendition. Self-contained Naftiko capability covering one Lightroom business surface.'
  tags:
  - Lightroom
  - Renditions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LIGHTROOM_API_KEY: LIGHTROOM_API_KEY
capability:
  consumes:
  - type: http
    namespace: services-renditions
    baseUri: https://lr.adobe.io/v2
    description: Adobe Lightroom Lightroom Services API — Renditions business capability. Self-contained, no shared references.
    resources:
    - name: catalogs-catalog_id-assets-asset_id-renditions-rendition_type
      path: /catalogs/{catalog_id}/assets/{asset_id}/renditions/{rendition_type}
      operations:
      - name: getassetrendition
        method: GET
        description: Adobe Lightroom Get an Asset Rendition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LIGHTROOM_API_KEY}}'
  exposes:
  - type: rest
    namespace: services-renditions-rest
    port: 8080
    description: REST adapter for Adobe Lightroom Lightroom Services API — Renditions. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/catalogs/{catalog-id}/assets/{asset-id}/renditions/{rendition-type}
      name: catalogs-catalog-id-assets-asset-id-renditions-rendition-type
      description: REST surface for catalogs-catalog_id-assets-asset_id-renditions-rendition_type.
      operations:
      - method: GET
        name: getassetrendition
        description: Adobe Lightroom Get an Asset Rendition
        call: services-renditions.getassetrendition
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: services-renditions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Lightroom Lightroom Services API — Renditions. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: adobe-lightroom-get-asset-rendition
      description: Adobe Lightroom Get an Asset Rendition
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: services-renditions.getassetrendition
      outputParameters:
      - type: object
        mapping: $.
